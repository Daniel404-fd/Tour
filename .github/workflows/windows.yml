name: Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
      - run: pyinstaller --noconfirm --clean HabitTracker.spec
      - uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-windows
          path: desktop/dist/HabitTracker.exe
      - name: Выложить в релиз «Последняя версия»
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя версия
          body: Файлы собираются автоматически при каждом изменении. HabitTracker.apk — для телефона, HabitTracker.exe — для Windows.
          files: desktop/dist/HabitTracker.exe
